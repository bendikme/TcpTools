# Builds, tests and publishes TcpTools when a version tag is pushed.
#
#   git tag v26.11.1 && git push origin v26.11.1
#
# The file that is published is the file the end-to-end tests ran against.
# The DYNATEC Portal's Applications page offers the newest release's
# TcpTools-<version>-windows-x64.zip (software entry "TcpTools", tag prefix "v").
#
# Code signing: add the repository secrets TCPTOOLS_SIGN_PFX_BASE64 (the
# code-signing certificate as a base64 .pfx) and TCPTOOLS_SIGN_PFX_PASSWORD.
# Without them the release is published unsigned.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write        # create the release and upload its file

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag must match Version.h
        shell: pwsh
        run: |
          $m = Select-String -Path Version.h -Pattern 'TCPTOOLS_VERSION_STR\s+"([^"]+)"'
          $version = $m.Matches[0].Groups[1].Value
          if ("v$version" -ne $env:GITHUB_REF_NAME) {
            throw "Tag $env:GITHUB_REF_NAME does not match Version.h ($version)"
          }

      # Windows PowerShell, like on a developer machine. The tests start
      # TcpTools.exe and drive its window; a hosted runner is slower than a
      # desktop, hence the wider limit for the responsiveness check.
      - name: Build, test, sign and package
        shell: powershell
        env:
          TCPTOOLS_SIGN_PFX_BASE64: ${{ secrets.TCPTOOLS_SIGN_PFX_BASE64 }}
          TCPTOOLS_SIGN_PFX_PASSWORD: ${{ secrets.TCPTOOLS_SIGN_PFX_PASSWORD }}
        run: .\scripts\release.ps1 -MaxLagMs 6000

      - name: Stop a TcpTools.exe the failed tests left running
        if: failure()
        shell: powershell
        run: Get-Process TcpTools -ErrorAction SilentlyContinue | Stop-Process -Force

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag     = $env:GITHUB_REF_NAME
          $version = $tag.Substring(1)
          $zip     = "dist\TcpTools-$version-windows-x64.zip"
          $notes   = "docs\release-notes\$tag.md"
          if (Test-Path $notes) {
            gh release create $tag $zip --title "TcpTools $version" --verify-tag --notes-file $notes
          } else {
            gh release create $tag $zip --title "TcpTools $version" --verify-tag --generate-notes
          }
